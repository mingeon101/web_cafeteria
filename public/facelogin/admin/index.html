<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 등록 관리</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef8fb;color:#17343e;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:clamp(30px,5vw,48px);margin-bottom:8px}.warning{background:#fff1dc;border-left:5px solid #e88728;padding:16px;border-radius:12px;line-height:1.6}.card{background:white;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 12px 40px #39798f14}.form{display:grid;grid-template-columns:1.6fr repeat(3,1fr) 1.8fr 1.25fr auto;gap:10px;align-items:end}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;padding:12px;border:2px solid #c8e1e8;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:#39798f;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#edf5f7;color:#17343e}.danger{background:#c94f4f}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center}.toolbar input{max-width:340px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;border-bottom:1px solid #dcebef;padding:12px 8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{min-height:24px;color:#39798f}.rules{white-space:pre-wrap;background:#102b35;color:#e5f7fb;padding:18px;border-radius:14px;overflow:auto;font:13px/1.55 ui-monospace,monospace}.facePanel{display:none}.facePanel.show{display:block}.camera{position:relative;max-width:620px;aspect-ratio:4/3;background:#102b35;border-radius:18px;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.faceGuide{position:absolute;inset:12% 25%;border:3px solid white;border-radius:48%}.faceButtons{display:flex;gap:10px;max-width:620px;margin-top:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf5f7;font-size:13px}.badge.ok{background:#def3e3;color:#236633}@media(max-width:760px){.form{grid-template-columns:1fr 1fr}.form>*:first-child{grid-column:1/-1}.tableWrap{overflow:auto}.toolbar{align-items:stretch;flex-direction:column}}</style><script data-allergy-inline="core">
(function(root){
 'use strict';
 // Allergen numbers: https://www.ice.go.kr/icefood/cm/cntnts/cntntsView.do?cntntsId=629&mi=10779
 const names=['난류','우유','메밀','땅콩','대두','밀','고등어','게','새우','돼지고기','복숭아','토마토','아황산류','호두','닭고기','쇠고기','오징어','조개류','잣'];
 const aliases={계란:'난류',달걀:'난류',달걀류:'난류',난백:'난류',난황:'난류',egg:'난류',eggs:'난류',milk:'우유',콩:'대두',soy:'대두',대두콩:'대두',wheat:'밀',소고기:'쇠고기',소:'쇠고기',아황산염:'아황산류',굴:'조개류',전복:'조개류',홍합:'조개류',조개:'조개류'};
 function normalize(value){
  const out=new Set();
  function add(v){
   if(v===null||v===undefined||v===false)return;
   if(Array.isArray(v)){v.forEach(add);return;}
   if(typeof v==='object'){for(const [k,x] of Object.entries(v)){if(x===true)add(k);else add(x);}return;}
   let text=String(v).replace(/[①-⑲]/g,c=>','+(c.charCodeAt(0)-0x2460+1)+',').normalize('NFKC');
   if(/^(없음|해당없음|알레르기없음|none|0|-)$/i.test(text.replace(/\s/g,'')))return;
   text=text.replace(/조개류\([^)]*\)/g,'조개류');
   for(let token of text.split(/[,;\/|·\n]+/)){
    token=token.trim();if(!token)continue;
    if(/^[\d.\s()]+$/.test(token)){for(const n of token.match(/\d+/g)||[])if(+n>=1&&+n<=19)out.add(names[+n-1]);continue;}
    token=token.replace(/^([^()]+)\(.*$/,'$1').replace(/[()]/g,'').replace(/^\d{1,2}[.)]\s*/,'').replace(/\s*(함유|알레르기)\s*$/,'').replace(/\s+/g,'').toLowerCase();
    if(token)out.add(aliases[token]||names.find(n=>n===token)||token.slice(0,40));
   }
  }add(value);return [...out].sort();
 }
 function info(value){
  if(value===null||value===undefined||typeof value==='string'&&(!value.trim()||/^(미등록|정보\s*없음|확인\s*필요)$/.test(value.trim())))return{known:false,tokens:[]};
  return{known:true,tokens:normalize(value)};
 }
 function evaluate(student,menu,metadata,foods=['밥','국','김치']){
  const mine=normalize(student),perFood=metadata&&typeof metadata==='object'&&!Array.isArray(metadata)&&foods.some(f=>Object.hasOwn(metadata,f));
  return foods.map(food=>{
   if(!mine.length)return{food,blocked:false,matches:[],unknown:false,global:false};
   let data=info(perFood?metadata[food]:metadata);
   if(!perFood&&Array.isArray(metadata)&&!metadata.length)data={known:false,tokens:[]};
   const annotations=[...String(menu?.[food]||'').matchAll(/[（(]([\d.\s,·]+)[）)]/g)].flatMap(m=>normalize(m[1]));
   const tokens=new Set([...data.tokens,...annotations]),known=data.known||annotations.length>0,matches=mine.filter(x=>tokens.has(x));
   return{food,blocked:matches.length>0,matches,unknown:!known,global:!perFood&&matches.length>0};
  });
 }
 function sanitize(counts,statuses){return counts.map((v,i)=>statuses[i]?.blocked?0:Math.max(0,Number(v)||0));}
 root.CafeteriaAllergy={names,normalize,evaluate,sanitize};
})(globalThis);
</script><style data-allergy-inline="style">
.allergy-blocked{background:#fff0f0!important;border:2px solid #d74747!important;color:#a51f2b!important}.allergy-note{display:block;color:#ad2430;font-size:13px;font-weight:800;line-height:1.6;margin:9px 0;overflow-wrap:anywhere}.allergy-blocked button:disabled,.allergy-blocked input:disabled{opacity:.45;cursor:not-allowed}.allergy-banner{border:1px solid #edb7bb;background:#fff3f3;color:#9e2530;border-radius:13px;padding:12px 15px;margin:12px 0;font-size:14px;line-height:1.7}.allergy-fieldset{grid-column:1/-1;border:1px solid #c8e1e8;border-radius:12px;padding:14px;min-width:0}.allergy-fieldset legend{font-weight:800;padding:0 6px}.allergy-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}.allergy-options label{display:flex;align-items:center;gap:7px;font-size:13px;margin:0;padding:5px}.allergy-options input{width:auto!important;accent-color:#bc293b}.allergy-fieldset p{font-size:12px;line-height:1.7;color:#526a72;margin:8px 0}.allergy-extra{margin-top:10px}.student-allergy-value{color:#ac2634;max-width:220px;overflow-wrap:anywhere}

.food-circle.allergy-blocked{aspect-ratio:auto;min-height:175px;border-radius:26px;padding:12px 5px}.food-circle.allergy-blocked .allergy-note{font-size:11px;text-align:center;max-width:95%;margin:7px auto}.final-row.allergy-blocked,.edit-row.allergy-blocked{flex-wrap:wrap}.final-row.allergy-blocked>.allergy-note,.edit-row.allergy-blocked>.allergy-note{flex:0 0 100%;width:100%;text-align:center}
</style></head><body><main><h1>학생 등록 관리</h1>
<section class="card"><h2 id="formTitle">학생 등록</h2><form class="form" id="studentForm"><div><label>이름</label><input id="name" required maxlength="30"></div><div><label>학년</label><input id="grade" required type="number" min="1" max="6"></div><div><label>반</label><input id="classNo" required type="number" min="1"></div><div><label>번호</label><input id="number" required type="number" min="1"></div><div><label>이메일</label><input id="email" required type="email" autocomplete="email" maxlength="120" placeholder="student@example.com"></div><div><label>PIN (4~6자리)</label><input id="pin" required type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6"></div><fieldset class="allergy-fieldset"><legend>학생 알레르기</legend><p>해당 항목을 선택하세요. 없으면 선택하지 않습니다.</p><div class="allergy-options" id="student-allergy-options"></div><label class="allergy-extra" for="student-allergy-extra">기타 알레르기 (쉼표로 구분)</label><input id="student-allergy-extra" maxlength="300" placeholder="예: 키위"></fieldset><button type="submit">저장</button></form><button class="secondary" id="cancel" hidden>수정 취소</button><p class="status" id="status" aria-live="polite"></p></section>
<section class="card"><div class="toolbar"><h2>등록 학생</h2><input id="search" placeholder="이름 또는 학년-반-번호 검색"></div><div class="tableWrap"><table><thead><tr><th>이름</th><th>이메일</th><th>학년</th><th>반</th><th>번호</th><th>알레르기</th><th>얼굴</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card facePanel" id="facePanel"><h2 id="faceTitle">얼굴 등록</h2><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="faceGuide"></div></div><p>한 사람만 화면에 나오게 하고 정면을 바라봐 주세요. 다시 등록하면 이전 특징 데이터가 교체됩니다.</p><div class="faceButtons"><button id="captureFace">이 얼굴 등록</button><button class="secondary" id="closeFace">닫기</button></div><p class="status" id="faceStatus" aria-live="polite"></p></section>
<script>
const firebaseConfig={apiKey:"AIzaSyC3SvV8-bTyQClyZlGWybhR3z5YvLGXYL0",authDomain:"smart-cafeteria-8a2ce.firebaseapp.com",databaseURL:"https://smart-cafeteria-8a2ce-default-rtdb.firebaseio.com",projectId:"smart-cafeteria-8a2ce",storageBucket:"smart-cafeteria-8a2ce.firebasestorage.app",messagingSenderId:"304671336012",appId:"1:304671336012:web:0fd90cf8e6cc06884176e9",measurementId:"G-JWNDVQC63K"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let students={},editing=null,faceUid=null,faceStream=null,faceModelsReady=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.trim().toLowerCase();$('rows').innerHTML=Object.entries(students).filter(([,s])=>!q||s.name?.toLowerCase().includes(q)||s.lookupKey?.includes(q)).sort((a,b)=>(a[1].lookupKey||'').localeCompare(b[1].lookupKey||'',undefined,{numeric:true})).map(([uid,s])=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email||'-')}</td><td>${esc(s.grade)}</td><td>${esc(s.classNo)}</td><td>${esc(s.number)}</td><td class="student-allergy-value">${esc(CafeteriaAllergy.normalize(s.allergies).join(', ')||'없음')}</td><td><span class="badge ${Array.isArray(s.faceDescriptor)?'ok':''}">${Array.isArray(s.faceDescriptor)?'등록됨':'미등록'}</span></td><td class="actions"><button data-face="${uid}">${Array.isArray(s.faceDescriptor)?'얼굴 재등록':'얼굴 등록'}</button><button data-edit="${uid}">수정</button><button class="danger" data-delete="${uid}">삭제</button></td></tr>`).join('')||'<tr><td colspan="8">등록된 학생이 없습니다.</td></tr>';document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>openFace(b.dataset.face));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeStudent(b.dataset.delete))}
const allergyOptions=document.getElementById('student-allergy-options');CafeteriaAllergy.names.forEach(name=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=name;input.name='studentAllergy';label.append(input,document.createTextNode(name));allergyOptions.append(label);});
function readStudentAllergies(){return CafeteriaAllergy.normalize([...allergyOptions.querySelectorAll('input:checked')].map(i=>i.value).concat(document.getElementById('student-allergy-extra').value.split(',')));}
function setStudentAllergies(value){const saved=CafeteriaAllergy.normalize(value);allergyOptions.querySelectorAll('input').forEach(i=>i.checked=saved.includes(i.value));document.getElementById('student-allergy-extra').value=saved.filter(x=>!CafeteriaAllergy.names.includes(x)).join(', ');}
db.ref('students').on('value',s=>{students=s.val()||{};render()},e=>$('status').textContent='목록을 읽을 수 없습니다. 관리자 인증과 보안 규칙을 확인하세요.');$('search').oninput=render;
$('studentForm').onsubmit=async e=>{e.preventDefault();const data={allergies:readStudentAllergies(),name:$('name').value.trim(),email:$('email').value.trim().toLowerCase(),grade:+$('grade').value,classNo:+$('classNo').value,classNum:+$('classNo').value,number:+$('number').value,pin:$('pin').value,updatedAt:firebase.database.ServerValue.TIMESTAMP};data.lookupKey=`${data.grade}-${data.classNo}-${data.number}`;if(!data.name||!/^\S+@\S+\.\S+$/.test(data.email)||!/^\d{4,6}$/.test(data.pin))return $('status').textContent='이름, 올바른 이메일 주소, 4~6자리 숫자 PIN을 확인하세요.';const duplicate=Object.entries(students).find(([id,s])=>id!==editing&&s.lookupKey===data.lookupKey);if(duplicate)return $('status').textContent='같은 학년·반·번호가 이미 등록되어 있습니다.';try{await db.ref('students/'+(editing||db.ref('students').push().key)).update(data);reset();$('status').textContent='저장했습니다.'}catch(err){$('status').textContent='저장할 수 없습니다. 관리자 인증과 보안 규칙을 확인하세요.'}};
function edit(uid){const s=students[uid];editing=uid;setStudentAllergies(s.allergies);$('name').value=s.name??'';$('email').value=s.email??'';$('grade').value=s.grade??'';$('classNo').value=s.classNo??s.classNum??s.class??'';$('number').value=s.number??'';$('pin').value=s.pin??'';$('formTitle').textContent='학생 수정';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}function reset(){editing=null;$('studentForm').reset();setStudentAllergies([]);$('formTitle').textContent='학생 등록';$('cancel').hidden=true}$('cancel').onclick=reset;async function removeStudent(uid){if(!confirm(`${students[uid]?.name||'학생'} 정보를 삭제할까요?`))return;try{await db.ref('students/'+uid).remove();if(editing===uid)reset();$('status').textContent='삭제했습니다.'}catch(e){$('status').textContent='삭제할 수 없습니다.'}}

const FACE_MODEL_URL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
async function loadFaceModels(){try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)]);faceModelsReady=true}catch(e){$('status').textContent='얼굴 인식 모델을 불러오지 못했습니다.'}}
async function openFace(uid){faceUid=uid;$('faceTitle').textContent=`${students[uid]?.name||'학생'} 얼굴 등록`;$('facePanel').classList.add('show');$('faceStatus').textContent=faceModelsReady?'카메라를 준비하고 있습니다.':'얼굴 인식 모델을 준비하고 있습니다.';scrollTo({top:$('facePanel').offsetTop-20,behavior:'smooth'});try{if(!faceModelsReady)await loadFaceModels();faceStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});$('faceVideo').srcObject=faceStream;await $('faceVideo').play();$('faceStatus').textContent='정면을 바라본 뒤 등록 버튼을 누르세요.'}catch(e){$('faceStatus').textContent='카메라를 사용할 수 없습니다. HTTPS 또는 localhost에서 실행하세요.'}}
function closeFace(){faceStream?.getTracks().forEach(t=>t.stop());faceStream=null;$('faceVideo').srcObject=null;$('facePanel').classList.remove('show');faceUid=null}$('closeFace').onclick=closeFace;
$('captureFace').onclick=async()=>{const button=$('captureFace');if(!faceUid)return;button.disabled=true;$('faceStatus').textContent='얼굴 특징을 추출하는 중입니다...';try{const results=await faceapi.detectAllFaces($('faceVideo'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptors();if(results.length===0)throw new Error('얼굴을 찾지 못했습니다. 정면을 바라봐 주세요.');if(results.length>1)throw new Error('한 사람만 화면에 나오게 해주세요.');await db.ref(`students/${faceUid}`).update({faceDescriptor:Array.from(results[0].descriptor),faceRegisteredAt:firebase.database.ServerValue.TIMESTAMP});$('faceStatus').textContent='얼굴 특징 데이터를 등록했습니다.';setTimeout(closeFace,700)}catch(e){$('faceStatus').textContent=e.message||'얼굴 등록에 실패했습니다.'}finally{button.disabled=false}};
loadFaceModels();
</script></body></html>
