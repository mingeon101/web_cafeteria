<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 급식 · 한끼 체크</title><link rel="stylesheet" href="events.css"><link rel="stylesheet" href="student-view.css"></head><body><header><a class="brand" href="student-view.html">▦ 한끼 체크</a><a class="back" href="./">식판 인식</a></header><main>
<div class="heading"><div><span class="eyebrow">학생 전용</span><h1>나의 급식</h1><p>나의 잔반 기록과 받을 수 있는 보상을 확인해요.</p></div></div>
<section class="card identity-card"><div class="section-head"><h2 id="student-greeting">나는 누구인가요?</h2><button id="student-change" hidden>학생 변경</button></div><form id="viewer-form"><div class="viewer-inputs"><label>학년<input id="viewer-grade" type="number" min="1" max="99" step="1" inputmode="numeric" required></label><label>반<input id="viewer-class" type="number" min="1" max="999" step="1" inputmode="numeric" required></label><label>번호<input id="viewer-number" type="number" min="1" max="999" step="1" inputmode="numeric" required></label><button id="viewer-confirm" class="primary">내 기록 보기</button></div></form><p id="viewer-status" role="status" aria-live="polite">학년·반·번호를 입력하세요.</p></section>
<section id="personal-panel" hidden><div class="section-head"><h2>나의 잔반 기록</h2><button id="viewer-refresh">새로고침</button></div><form id="viewer-range" class="filters"><label>시작일<input id="viewer-start" type="date" required></label><label>종료일<input id="viewer-end" type="date" required></label><button id="viewer-load">조회</button></form><p id="record-status" role="status" aria-live="polite"></p><div class="metrics viewer-metrics"><article><span>평균 잔반 면적</span><strong id="viewer-average">—</strong></article><article><span>측정한 식사</span><strong id="viewer-meals">—</strong></article></div><article class="card"><div class="section-head"><h2>날짜별 기록</h2><span>잔반 면적 %</span></div><div id="viewer-history" class="empty">아직 측정 기록이 없습니다.</div></article></section>
<section><div class="section-head"><h2>급식 이벤트</h2><span id="event-count"></span></div><p id="viewer-event-status" role="status" aria-live="polite"></p><div id="viewer-events" class="viewer-events"><p class="empty">이벤트를 불러오는 중…</p></div></section><p class="note">잔반 수치는 식판 영상에서 추정한 면적입니다. 이벤트 보상은 조건을 확인한 뒤 선생님이 지급합니다.</p>
</main><script src="event-core.js?v=1"></script><script src="student-view.js?v=1"></script></body></html>
