<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211c3b">
  <title>오늘의 급식 | Smart Cafeteria</title>
  <style>
    :root{--ink:#1d1a30;--muted:#716c83;--purple:#7358d6;--lav:#f0edff;--orange:#ed7650;--bg:#f7f6fb;--line:#e8e5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif}.top{min-height:290px;background:radial-gradient(circle at 85% 10%,#5d4cb0 0,transparent 30%),linear-gradient(125deg,#19172b,#29204d);color:#fff;padding:28px 20px 110px}.wrap{max-width:760px;margin:auto}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.brand b{display:grid;place-items:center;width:34px;height:34px;background:#765ce2;border-radius:11px}.kicker{margin:60px 0 9px;color:#d8d1ff;font-weight:700;font-size:13px;letter-spacing:.1em}.top h1{margin:0;font-size:clamp(31px,8vw,46px);letter-spacing:-.06em}.top p{margin:14px 0 0;color:#ddd9ea;line-height:1.6}.content{max-width:760px;margin:-72px auto 0;padding:0 20px 55px}.date-card,.menu-card{background:#fff;border:1px solid var(--line);box-shadow:0 14px 40px rgba(34,28,67,.09);border-radius:22px}.date-card{padding:20px;display:flex;align-items:center;gap:14px}.calendar{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--lav);font-size:21px}.date-copy{flex:1}.date-copy span{display:block;color:var(--muted);font-size:13px}.date-copy strong{display:block;font-size:18px;margin-top:3px;letter-spacing:-.03em}.refresh{border:0;background:var(--purple);color:#fff;font:inherit;font-weight:700;border-radius:11px;padding:11px 14px;cursor:pointer}.refresh:hover{background:#5c43bd}.refresh:disabled{opacity:.55;cursor:wait}.menu-card{margin-top:18px;padding:25px}.menu-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.menu-head h2{margin:0;font-size:22px;letter-spacing:-.045em}.pill{white-space:nowrap;color:#5a43b4;background:var(--lav);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.menu-list{display:grid;gap:12px;margin:21px 0 0}.item{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.food-icon{display:grid;place-items:center;flex:0 0 43px;height:43px;border-radius:13px;background:#f5f3fa;font-size:22px}.food-copy{min-width:0}.food-copy span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.food-copy strong{display:block;font-size:17px;overflow-wrap:anywhere;letter-spacing:-.025em}.notice{margin-top:17px;padding:15px 16px;border-radius:14px;background:#fff7ee;color:#865233;line-height:1.55;font-size:13px}.state{text-align:center;padding:45px 10px;color:var(--muted)}.state .big{font-size:34px;margin-bottom:12px}.state p{margin:0;line-height:1.6}.error{background:#fff2f0;color:#b24032}.foot{text-align:center;color:#8d879d;font-size:12px;padding:22px 0 0}@media(max-width:480px){.top{padding-bottom:100px}.kicker{margin-top:43px}.content{padding:0 14px 40px}.date-card{padding:16px}.date-copy strong{font-size:16px}.refresh{padding:10px;font-size:13px}.menu-card{padding:19px}.item{padding:13px}.food-copy strong{font-size:16px}}
  </style>
<style>.ms-panel{margin:22px 0;padding:24px;border:1px solid #e8e5f0;border-radius:20px;background:white}.ms-panel h2{font-size:22px;margin-bottom:12px}.ms-panel h3{font-size:17px;margin:20px 0 12px}.ms-panel p{font-size:13px;line-height:1.8;color:#716c83}.ms-panel select,.ms-panel input:not([type=checkbox]){padding:10px;border:1px solid #ddd;border-radius:9px;background:white;font:inherit;max-width:100%}.ms-panel label{display:block;margin:12px 0;font-size:14px}.ms-panel button{padding:11px 16px;border:0;border-radius:10px;background:#7358d6;color:white;font:inherit;cursor:pointer;margin:8px 5px 0 0}.ms-panel button:disabled{opacity:.5;cursor:not-allowed}.ms-panel [hidden]{display:none!important}.ms-table-wrap{overflow-x:auto}.ms-panel table{border-collapse:collapse;width:100%;font-size:14px}.ms-panel th,.ms-panel td{padding:12px;text-align:left;border-bottom:1px solid #eee}.ms-range{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.ms-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.ms-dinner-menu input{width:100%}.ms-check{display:flex!important;align-items:center;gap:9px}.ms-check input{width:18px;height:18px;accent-color:#7358d6}.ms-panel :focus-visible{outline:3px solid #7358d6;outline-offset:3px}@media(max-width:650px){.ms-panel{padding:17px}.ms-form-grid{grid-template-columns:1fr}.ms-panel td,.ms-panel th{padding:8px}.ms-range input{width:115px}}
</style><script>(function(root){'use strict';
const labels={elementary:'초등학교',middle:'중학교',high:'고등학교'};
const count=t=>t==='elementary'?6:3;
const timeOK=t=>typeof t==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t);
function windowOK(w){return w&&timeOK(w.start)&&timeOK(w.end)&&w.start<w.end;}
function defaults(){return{schemaVersion:1,schoolType:'middle',gradeCount:3,dinnerEnabled:false,gradeScheduleEnabled:false,commonTimes:{lunch:{start:'12:00',end:'13:00'},dinner:{start:'18:00',end:'19:00'}},grades:Object.fromEntries(Array.from({length:6},(_,i)=>[String(i+1),{lunch:{start:'12:00',end:'13:00'},dinner:{start:'18:00',end:'19:00'}}]))};}
function normalize(raw){if(raw==null)return defaults();if(raw.schemaVersion!==1||!Object.hasOwn(labels,raw.schoolType)||typeof raw.dinnerEnabled!=='boolean'||typeof raw.gradeScheduleEnabled!=='boolean')throw Error('저장된 급식 운영 설정을 확인해 주세요.');const out=defaults();out.schoolType=raw.schoolType;out.gradeCount=count(raw.schoolType);out.dinnerEnabled=raw.dinnerEnabled;out.gradeScheduleEnabled=raw.gradeScheduleEnabled;if(!windowOK(raw.commonTimes?.lunch)||(out.dinnerEnabled&&!windowOK(raw.commonTimes?.dinner)))throw Error('공통 급식 시간을 올바르게 입력해 주세요.');out.commonTimes={lunch:{...raw.commonTimes.lunch},dinner:windowOK(raw.commonTimes.dinner)?{...raw.commonTimes.dinner}:out.commonTimes.dinner};for(let g=1;g<=6;g++){const row=raw.grades?.[g];if(row){if(out.gradeScheduleEnabled&&g<=out.gradeCount&&(!windowOK(row.lunch)||(out.dinnerEnabled&&!windowOK(row.dinner))))throw Error(g+'학년 배식 시간 설정이 올바르지 않습니다.');out.grades[g]={lunch:windowOK(row.lunch)?{...row.lunch}:out.grades[g].lunch,dinner:windowOK(row.dinner)?{...row.dinner}:out.grades[g].dinner};}else if(out.gradeScheduleEnabled&&g<=out.gradeCount)throw Error(g+'학년 배식 시간이 없습니다.');}return out;}
function validate(raw){const v=normalize(raw);const items=v.gradeScheduleEnabled?Array.from({length:v.gradeCount},(_,i)=>[String(i+1)+'학년',v.grades[i+1]]):[['공통',v.commonTimes]];for(const [label,row]of items)if(v.dinnerEnabled&&row.dinner.start<row.lunch.end)throw Error(label+' 석식은 중식 종료 이후로 설정해 주세요.');return v;}
function forGrade(cfg,grade){if(!cfg.gradeScheduleEnabled)return cfg.commonTimes;return Number.isInteger(Number(grade))&&grade>=1&&grade<=cfg.gradeCount?cfg.grades[grade]:null;}
root.MealServiceCore={labels,count,timeOK,windowOK,defaults,normalize,validate,forGrade};
})(globalThis);
</script><script>(function(root){
const C=root.MealServiceCore;
function reservation(base,cfg,meal){if(!cfg||!base)return base;const rows=cfg.gradeScheduleEnabled?Array.from({length:cfg.gradeCount},(_,i)=>cfg.grades[i+1][meal]):[cfg.commonTimes[meal]],start=rows.map(w=>w.start).sort()[0],end=rows.map(w=>w.end).sort().at(-1);if(meal==='dinner')return{...base,slots:{dinner:{start,end,label:'석식 '+start+' ~ '+end}}};const slots={};for(const [id,s]of Object.entries(base.slots||{})){const a=s.start>start?s.start:start,b=s.end<end?s.end:end;if(a<b)slots[id]={...s,start:a,end:b,label:a+' ~ '+b};}if(!Object.keys(slots).length)slots.lunch={start,end,label:'중식 '+start+' ~ '+end};return{...base,slots};}
function sharedWindow(cfg,meal,members,slot){if(!cfg)return slot;let start=slot.start,end=slot.end;for(const p of members){const row=C.forGrade(cfg,p.grade);if(!row)throw Error('학교 구분과 친구의 학년을 확인하세요.');const w=row[meal];start=start>w.start?start:w.start;end=end<w.end?end:w.end;}if(start>=end)throw Error('같이 앉을 학생들의 배식 시간이 겹치지 않습니다. 다른 친구 또는 시간대를 선택하세요.');return{start,end};}
root.MealIntegration={reservation,sharedWindow};
})(globalThis);
</script></head>
<body>
  <header class="top"><div class="wrap"><div class="brand"><b>🍱</b> Smart Cafeteria</div><p class="kicker">TODAY'S MENU</p><h1>오늘의 급식</h1><p>오늘 제공되는 식단을 확인해 보세요.</p></div></header>
  <main class="content">
    <section class="date-card" aria-label="식단 날짜"><div class="calendar">📅</div><div class="date-copy"><span>급식 제공일</span><strong id="displayDate">불러오는 중</strong></div><button type="button" class="refresh" id="refresh">새로고침</button></section>
    <section class="ms-panel"><div class="ms-form-grid"><label>급식 구분<select id="ms-view-meal"><option value="lunch">중식</option><option value="dinner" hidden>석식</option></select></label></div><div id="ms-view-schedule" role="status"></div></section><section class="menu-card" aria-live="polite"><div class="menu-head"><h2>오늘의 메뉴</h2><span class="pill" id="menuStatus">실시간 연동</span></div><div id="menuBody"><div class="state"><div class="big">🍽️</div><p>오늘의 식단을 불러오는 중입니다.</p></div></div></section>
    <p class="foot">메뉴는 급식 운영 시스템에 등록된 정보로 표시됩니다.</p>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
    const firebaseConfig={apiKey:'AIzaSyC3SvV8-bTyQClyZlGWybhR3z5YvLGXYL0',authDomain:'smart-cafeteria-8a2ce.firebaseapp.com',databaseURL:'https://smart-cafeteria-8a2ce-default-rtdb.firebaseio.com',projectId:'smart-cafeteria-8a2ce',storageBucket:'smart-cafeteria-8a2ce.firebasestorage.app',messagingSenderId:'304671336012',appId:'1:304671336012:web:0fd90cf8e6cc06884176e9'};
    const db=getDatabase(initializeApp(firebaseConfig));
    const body=document.querySelector('#menuBody'), status=document.querySelector('#menuStatus'), refresh=document.querySelector('#refresh');
    const categories=[['밥','🍚','밥'],['국','🍲','국·찌개'],['김치','🥬','반찬']];
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const formatDate=value=>{const date=value?new Date(`${value}T00:00:00`):new Date();return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(date)};
    async function loadMenu(){
      refresh.disabled=true;document.querySelector('#ms-view-meal').disabled=true;status.textContent='불러오는 중';body.innerHTML='<div class="state"><div class="big">🍽️</div><p>오늘의 식단을 불러오는 중입니다.</p></div>';
      try{
        const cfgSnap=await get(ref(db,'cafeteriaSettings/mealService'));const saved=cfgSnap.val(),cfg=MealServiceCore.normalize(saved);const selector=document.querySelector('#ms-view-meal');selector.querySelector('[value=dinner]').hidden=!cfg.dinnerEnabled;if(!cfg.dinnerEnabled)selector.value='lunch';const meal=selector.value;document.querySelector('#ms-view-schedule').replaceChildren();const lines=[MealServiceCore.labels[cfg.schoolType]+(cfg.gradeScheduleEnabled?' · 학년별 배식':' · 공통 급식 시간')];if(saved){if(cfg.gradeScheduleEnabled)for(let g=1;g<=cfg.gradeCount;g++){const w=cfg.grades[g][meal];lines.push(g+'학년 '+w.start+' ~ '+w.end);}else{const w=cfg.commonTimes[meal];lines.push(w.start+' ~ '+w.end);}}else lines.push('급식 시간이 아직 설정되지 않았습니다.');for(const t of lines){const p=document.createElement('p');p.textContent=t;document.querySelector('#ms-view-schedule').append(p);}const data=(await get(ref(db,meal==='dinner'?'menus/dinner':'menu'))).val()||{};document.querySelector('.menu-head h2').textContent=meal==='dinner'?'오늘의 석식 메뉴':'오늘의 중식 메뉴';
        document.querySelector('#displayDate').textContent=formatDate(data.date);
        const foods=categories.map(([key,emoji,label])=>({emoji,label,name:String(data[key]||'').trim()})).filter(item=>item.name);
        if(!foods.length){status.textContent='등록 대기';body.innerHTML='<div class="state"><div class="big">🌿</div><p>오늘 등록된 식단이 없습니다.<br>잠시 후 다시 확인해 주세요.</p></div>';return;}
        status.textContent='실시간 연동';
        body.innerHTML='<div class="menu-list">'+foods.map(item=>`<article class="item"><span class="food-icon">${item.emoji}</span><div class="food-copy"><span>${item.label}</span><strong>${escapeHtml(item.name)}</strong></div></article>`).join('')+'</div><p class="notice">식단은 재료 수급과 급식 운영 상황에 따라 변경될 수 있습니다.</p>';
      }catch(error){console.error(error);status.textContent='연결 오류';body.innerHTML='<div class="state error"><div class="big">⚠️</div><p>식단 정보를 불러오지 못했습니다.<br>네트워크 연결 후 다시 시도해 주세요.</p></div>';}
      finally{refresh.disabled=false;document.querySelector('#ms-view-meal').disabled=false;}
    }
    document.querySelector('#ms-view-meal').addEventListener('change',loadMenu);refresh.addEventListener('click',loadMenu);loadMenu();
  </script>
</body>
</html>
