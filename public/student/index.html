<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영양리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================
   기존 스마트 급식 시스템 CSS
===================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --primary: #FF6B35;
  --primary-light: #fff0e8;
  --secondary: #F7C59F;
  --accent: #1A1A2E;
  --bg: #FFF8F3;
  --card: #FFFFFF;
  --muted: #8B7355;
  --success: #4CAF50;
  --danger: #E53935;
}
html,
body {
  min-height: 100%;
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--accent);
}
body {
  overflow-x: hidden;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
/* HEADER */
.header {
  background: var(--accent);
  color: white;
  padding: 18px 24px 15px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 24px rgba(26,26,46,0.35);
}
.header-logo {
  font-size: 28px;
  line-height: 1;
}
.header-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header-sub {
  font-size: 11px;
  opacity: 0.45;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 2px;
}
/* USER BAR */
.user-bar {
  background: var(--accent);
  padding: 0 24px 16px;
  color: white;
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-avatar {
  width: 38px;
  height: 38px;
  background: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.user-name {
  font-size: 14px;
  font-weight: 600;
}
.user-sub {
  font-size: 12px;
  opacity: 0.5;
  margin-top: 2px;
}
/* CONTENT */
.content {
  padding: 20px 16px 40px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
/* CARD */
.card {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.04);
}
.card.center {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}
/* ANIMATION */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.fade-up {
  animation: fadeUp 0.38s ease forwards;
}
/* BUTTON */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  outline: none;
  letter-spacing: -0.2px;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
}
.btn-primary:hover {
  background: #e85a26;
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}
.btn-secondary {
  background: #f0ebe5;
  color: var(--accent);
}
.btn-danger {
  background: #ffeaea;
  color: var(--danger);
}
.btn-full {
  width: 100%;
  margin-top: 8px;
}
/* =====================================================
   GEMINI OCR
===================================================== */
.ocr-video-wrap {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--accent);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
}
.ocr-video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
}
.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary);
  opacity: 0.9;
  animation: scanDown 2s ease-in-out infinite;
}
@keyframes scanDown {
  0% {
    top: 0;
  }
  50% {
    top: calc(100% - 3px);
  }
  100% {
    top: 0;
  }
}
.scan-corners {
  position: absolute;
  inset: 12px;
  pointer-events: none;
}
.sc {
  position: absolute;
  width: 22px;
  height: 22px;
  border-color: var(--primary);
  border-style: solid;
  opacity: 0.9;
}
.sc-tl {
  top: 0;
  left: 0;
  border-width: 2px 0 0 2px;
  border-radius: 4px 0 0 0;
}
.sc-tr {
  top: 0;
  right: 0;
  border-width: 2px 2px 0 0;
  border-radius: 0 4px 0 0;
}
.sc-bl {
  bottom: 0;
  left: 0;
  border-width: 0 0 2px 2px;
  border-radius: 0 0 0 4px;
}
.sc-br {
  bottom: 0;
  right: 0;
  border-width: 0 2px 2px 0;
  border-radius: 0 0 4px 0;
}
.ocr-status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(26,26,46,0.84);
  backdrop-filter: blur(6px);
  border-radius: 100px;
  padding: 9px 18px;
  color: white;
  font-size: 13px;
  font-weight: 600;
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}
.ocr-status-bar.hidden {
  opacity: 0;
}
.ocr-spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2.5px solid rgba(255,255,255,0.25);
  border-top-color: var(--primary);
  animation: ocrSpin .75s linear infinite;
}
@keyframes ocrSpin {
  to {
    transform: rotate(360deg);
  }
}
.ocr-result-box {
  width: 100%;
  background: var(--primary-light);
  border: 2px solid var(--secondary);
  border-radius: 14px;
  padding: 14px 18px;
  display: none;
  margin-bottom: 14px;
}
.ocr-result-box.visible {
  display: block;
}
.ocr-result-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.ocr-result-name {
  font-size: 24px;
  font-weight: 900;
  color: var(--accent);
}
.firebase-status {
  width: 100%;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  display: none;
  margin-bottom: 14px;
}
.firebase-status.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #e8f0fe;
  color: #1a73e8;
}
.firebase-status.found {
  display: block;
  background: #e8f5e9;
  color: #2e7d32;
  border: 1.5px solid #a5d6a7;
}
.firebase-status.not-found {
  display: block;
  background: #fff3e0;
  color: #e65100;
  border: 1.5px solid #ffcc80;
}
.firebase-status.error {
  display: block;
  background: #ffeaea;
  color: var(--danger);
  border: 1.5px solid #ffcdd2;
}
.fb-spinner {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(26,115,232,.25);
  border-top-color: #1a73e8;
  animation: ocrSpin .75s linear infinite;
}
@keyframes shutterFlash {
  0% {
    opacity: 1;
  }
  15% {
    opacity: .05;
  }
  100% {
    opacity: 1;
  }
}
.shutter-flash {
  animation: shutterFlash .3s ease;
}
.btn-capture {
  width: 100%;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 13px 20px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,107,53,.35);
  transition: all .2s;
  margin-bottom: 10px;
}
.btn-capture:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.manual-input-wrap {
  width: 100%;
  background: #f5f0eb;
  border-radius: 14px;
  padding: 16px;
  margin-top: 8px;
  display: none;
}
.manual-input-wrap.visible {
  display: block;
}
.manual-input-wrap label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}
.manual-input-wrap input {
  width: 100%;
  border: 2px solid #e8e0d8;
  border-radius: 10px;
  padding: 10px 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  outline: none;
  background: white;
}
.manual-input-wrap input:focus {
  border-color: var(--primary);
}
/* =====================================================
   REVIEW APP
===================================================== */
.hidden {
  display: none !important;
}
.user-review-box {
  background: white;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 16px rgba(0,0,0,.06);
}
.user-review-name {
  font-size: 19px;
  font-weight: 900;
}
.user-review-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
/* TODAY MENU */
.today-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.today-date {
  font-size: 13px;
  color: #8d95a3;
}
.today-title {
  font-size: 23px;
  font-weight: 800;
  margin-top: 5px;
}
.today-emoji {
  font-size: 40px;
}
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.menu-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 15px;
  background: #f7f8fa;
}
.menu-icon {
  font-size: 27px;
}
.menu-category {
  font-size: 12px;
  color: #9299a6;
}
.menu-name {
  font-size: 16px;
  font-weight: 700;
  margin-top: 3px;
}
/* RATING */
.rating-wrap {
  text-align: center;
  padding: 10px 0 25px;
}
.rating-label {
  font-weight: 700;
  margin-bottom: 12px;
}
.stars {
  display: flex;
  justify-content: center;
  gap: 6px;
}
.star {
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 40px;
  color: #dfe3e8;
  transition: .15s;
}
.star.active {
  color: #ffc107;
}
.rating-number {
  margin-top: 8px;
  color: #8d95a3;
}
/* SCORE */
.score-section {
  margin-bottom: 25px;
}
.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.score-name {
  font-weight: 700;
}
.score-buttons {
  display: flex;
  gap: 5px;
}
.score-btn {
  width: 34px;
  height: 34px;
  border: 1px solid #e0e4ea;
  background: white;
  border-radius: 9px;
  cursor: pointer;
}
.score-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
/* CHOICE */
.input-label {
  display: block;
  font-weight: 700;
  margin-bottom: 12px;
}
.choice-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 9px;
}
.choice {
  padding: 13px;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
  font-size: 14px;
  background: white;
}
.choice.active {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 700;
}
/* TEXT */
.review-input,
.recommend-input {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  border: 1px solid #e1e5ec;
  border-radius: 13px;
  padding: 14px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.review-input:focus,
.recommend-input:focus {
  border-color: var(--primary);
}
.review-visibility {
  display: flex;
  gap: 10px;
  margin: 14px 0 18px;
}
.review-visibility label {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px;
  border: 2px solid #e8e0d8;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-weight: 700;
}
/* RECOMMEND */
.recommend-card {
  background: linear-gradient(
    135deg,
    #fff3ea,
    #ffffff
  );
}
.recommend-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 1px;
}
.recommend-title {
  font-size: 23px;
  font-weight: 800;
  margin-top: 6px;
}
.recommend-desc {
  margin-top: 8px;
  color: #8a929f;
  font-size: 13px;
  line-height: 1.6;
}
.recommend-input-wrap {
  margin-top: 20px;
}
.recommend-input {
  min-height: 60px;
}
.recommend-result {
  margin-top: 15px;
}
.recommend-item {
  padding: 14px;
  background: white;
  border-radius: 13px;
  margin-bottom: 8px;
  font-weight: 700;
}
/* POPULAR */
.popular-list,
.review-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.popular-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #f7f8fa;
  border-radius: 13px;
}
.popular-name {
  font-weight: 700;
}
.popular-rating {
  color: #ffb300;
  font-weight: 800;
}
/* REVIEW */
.review-item {
  padding: 15px;
  border-radius: 13px;
  background: #f7f8fa;
}
.review-top {
  display: flex;
  justify-content: space-between;
}
.review-student {
  font-weight: 700;
}
.review-stars {
  color: #ffc107;
}
.review-comment {
  margin-top: 8px;
  color: #636b78;
  font-size: 14px;
}
.loading {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 20px;
}
.loading-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b9c0ca;
  animation: loading 1s infinite alternate;
}
.loading-dot:nth-child(2) {
  animation-delay: .2s;
}
.loading-dot:nth-child(3) {
  animation-delay: .4s;
}
@keyframes loading {
  from {
    opacity: .3;
    transform: translateY(0);
  }
  to {
    opacity: 1;
    transform: translateY(-5px);
  }
}
.empty {
  text-align: center;
  color: #9aa1ad;
  padding: 20px;
  font-size: 13px;
}
.error-message {
  color: var(--danger);
  font-size: 13px;
  margin-top: 10px;
}
/* FOOTER */
.footer {
  text-align: center;
  color: #9aa1ad;
  font-size: 12px;
  margin-top: 10px;
}
/* MOBILE */
@media(max-width:600px) {
  .content {
    padding: 16px 12px 40px;
  }
  .card {
    padding: 20px;
  }
  .score-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .choice-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<body><header class="header"><div><strong>우리학교 급식</strong><div class="nr-sub" style="color:#bbb;margin:2px 0">SMART CAFETERIA NUTRITION</div></div></header><main style="max-width:850px;margin:auto;padding:16px"><section class="nr-panel"><span class="nr-badge">MY NUTRITION</span><h2 id="userName" style="margin-top:12px">나의 영양리포트</h2><p class="nr-sub">일간·주간·월간 영양정보와 나의 잔반 기록을 확인해 보세요.</p><div class="nr-controls"><label>리포트 종류<select id="nrMode"><option value="day">일간</option><option value="week">주간</option><option value="month">월간</option></select></label><label>기준 날짜<input type="date" id="nrDate"></label><button class="nr-button" id="nrRefresh">다시 불러오기</button></div><p id="nrPeriod" class="nr-sub"></p><div id="nrStatus" class="nr-status" role="status" aria-live="polite"></div><div id="nrPreview"></div></section></main><script>(function(root){'use strict';
const metrics=['calories','carbohydrate','protein','fat','sodium'];
function dateOK(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;}
function keyOK(k){return typeof k==='string'&&k.length>0&&k.length<=128&&!/[.#$\[\]/\u0000-\u001f\u007f]/.test(k)&&!['__proto__','constructor','prototype'].includes(k);}
function iso(d){return d.toISOString().slice(0,10);}
function period(mode,date){if(!dateOK(date)||!['day','week','month'].includes(mode))throw Error('조회 날짜와 리포트 종류를 확인해 주세요.');const d=new Date(date+'T00:00:00Z');let start=date,end=date;if(mode==='week'){d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));start=iso(d);d.setUTCDate(d.getUTCDate()+6);end=iso(d);}if(mode==='month'){start=date.slice(0,7)+'-01';d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);end=iso(d);}return{mode,start,end};}
function dates(p){const out=[];for(let t=Date.parse(p.start);t<=Date.parse(p.end);t+=86400000)out.push(iso(new Date(t)));return out;}
function validReport(r,uid){return r&&typeof r==='object'&&!Array.isArray(r)&&(!r.studentId||r.studentId===uid);}
function reports(uid,manual,ai,p){return dates(p).flatMap(date=>{const m=manual?.[date],a=ai?.[date];if(m&&m.studentId&&m.studentId!==uid)throw Error('리포트 학생 정보가 일치하지 않습니다.');if(a&&a.studentId&&a.studentId!==uid)throw Error('리포트 학생 정보가 일치하지 않습니다.');const r=validReport(m,uid)?m:validReport(a,uid)?a:null;return r?[{...r,date}]:[];});}
function nutrition(rows){return Object.fromEntries(metrics.map(k=>{const values=rows.map(r=>r.nutrients?.[k]).filter(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0);const sum=values.reduce((a,b)=>a+b,0);return[k,{count:values.length,total:values.length?sum:null,average:values.length?sum/values.length:null}];}));}
function waste(uid,days,p){const rows=[];if(!days||typeof days!=='object')return rows;for(const date of dates(p)){const entries=days[date];if(!entries||typeof entries!=='object')continue;let latest=null;for(const [id,r] of Object.entries(entries)){if(!keyOK(id)||!r||typeof r!=='object'||r.studentId!==uid||(r.measurement!==undefined&&r.measurement!=='area_occupancy_not_weight')||typeof r.totalRemainingAreaPercent!=='number'||!Number.isFinite(r.totalRemainingAreaPercent)||r.totalRemainingAreaPercent<0||r.totalRemainingAreaPercent>100)continue;const time=Date.parse(r.createdAt);if(!Number.isFinite(time))continue;const row={...r,date,id,time};if(!latest||time>latest.time||(time===latest.time&&id>latest.id))latest=row;}if(latest)rows.push(latest);}return rows;}

</script><script type="module">import {

import {

  get,

const firebaseConfig = {
  apiKey:
    "AIzaSyC3SvV8-bTyQClyZlGWybhR3z5YvLGXYL0",

  databaseURL:
    "https://smart-cafeteria-8a2ce-default-rtdb.firebaseio.com",

    "smart-cafeteria-8a2ce",

    "smart-cafeteria-8a2ce.firebasestorage.app",

    "304671336012",

    "G-JWNDVQC63K"

const $=id=>document.getElementById(id);
function escapeHTML(v){return String(v??" ").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));}
const NR_METRICS=[['calories','열량','kcal',1000],['carbohydrate','탄수화물','g',150],['protein','단백질','g',50],['fat','지방','g',50],['sodium','나트륨','mg',2000]];

function nrRender(r){
 if(!r)return '';
 return `<span class="nr-badge">${r.mode==='manual'?'선생님이 작성한 개인 리포트':'학생별 AI 리포트'}</span><p class="nr-sub">${escapeHTML(r.date)} · ${escapeHTML(r.basisNote||'급식 기준 추정치')}</p><div class="nr-chart">${NR_METRICS.map(([k,l,u,s])=>{const v=r.nutrients?.[k],ok=typeof v==='number'&&Number.isFinite(v)&&v>=0,m=Math.max(s,ok?v:0);return `<div class="nr-metric">${l}<strong>${ok?v.toLocaleString('ko-KR',{maximumFractionDigits:1})+' '+u:'자료 없음'}</strong><div class="nr-track" role="img" aria-label="${l}: ${ok?v+' '+u:'자료 없음'}"><div class="nr-fill" style="width:${ok?Math.min(100,v/m*100):0}%"></div></div><small>눈금 0–${m} ${u} · 권장량 비율 아님</small></div>`;}).join('')}</div><div class="nr-note"><h3>오늘의 코멘트</h3>${escapeHTML(r.summary||'등록된 코멘트가 없습니다.')}</div><div class="nr-note"><h3>내일을 위한 코멘트</h3>${escapeHTML(r.tomorrow||'등록된 코멘트가 없습니다.')}</div>`;
}


const C=NutritionReportCore;
let nrReadVersion=0;
const params=new URLSearchParams(location.search),uid=params.get('studentId')||params.get('uid')||'';
const initial=params.get('date');$('nrDate').value=C.dateOK(initial)?initial:nrToday();
$('nrMode').value=['day','week','month'].includes(params.get('period'))?params.get('period'):'day';
const labels={day:'일간',week:'주간',month:'월간'};
function fmt(v){return v===null?'자료 없음':v.toLocaleString('ko-KR',{maximumFractionDigits:1});}
function help(p){$('nrPeriod').textContent=p.mode==='day'?p.start:`${p.start} ~ ${p.end} · ${p.mode==='week'?'월요일부터 일요일':'해당 월 전체'}`;}
function warning(message){return `<p class="nr-warning" role="status">${escapeHTML(message)}</p>`;}
function wasteRender(rows,p,error){const s=C.wasteSummary(rows);return `<section class="nr-section"><h3>잔반 리포트</h3>${error?warning(error):!s.count?'<p class="nr-sub">이 기간에 저장된 잔반 측정 기록이 없습니다.</p>':`<div class="nr-chart"><div class="nr-metric">${p.mode==='day'?'잔반 면적':'평균 잔반 면적'}<strong>${fmt(s.average)}%</strong></div><div class="nr-metric">측정한 날짜<strong>${s.count}일</strong></div></div><div class="nr-parts">${s.parts.map(part=>`<div class="nr-metric">${escapeHTML(part.name)}<strong>${fmt(part.average)}%</strong><div class="nr-track"><div class="nr-fill nr-waste-fill" style="width:${part.average}%"></div></div><small>${part.count}일 측정 기준</small></div>`).join('')}</div>`}<p class="nr-sub">학생별 하루 마지막 측정값을 사용합니다. 기록이 없는 날은 평균에서 제외합니다. 잔반 비율은 칸 안에 음식이 보이는 면적의 추정치이며, 무게나 실제 섭취량이 아닙니다.</p></section>`;}
function periodNutrition(rows,p,error){const sums=C.nutrition(rows),empty=rows.length===0;return `<section class="nr-section"><h3>${labels[p.mode]} 영양 리포트</h3>${error?warning(error):''}${empty?'<p class="nr-sub">이 기간에 공개된 영양 리포트가 없습니다.</p>':`<p class="nr-sub">공개된 일별 리포트 ${rows.length}일을 집계했습니다. ${C.dates(p).length-rows.length}일은 리포트가 없어 제외했습니다.</p><div class="nr-chart">${NR_METRICS.map(([k,l,u,scale])=>{const v=sums[k],max=Math.max(scale,v.average||0);return `<div class="nr-metric">${l} · 하루 평균<strong>${fmt(v.average)}${v.count?' '+u:''}</strong><div class="nr-track" role="img" aria-label="${l} 하루 평균 ${escapeHTML(fmt(v.average))} ${u}"><div class="nr-fill" style="width:${v.count?v.average/max*100:0}%"></div></div><small>합계 ${fmt(v.total)}${v.count?' '+u:''} · ${v.count}일 자료<br>눈금 0–${max} ${u} · 권장량 비율 아님</small></div>`;}).join('')}</div><div class="nr-note"><h3>기간 요약</h3>영양소마다 자료가 있는 날짜만 평균에 포함합니다. 자료가 없는 영양소를 0으로 계산하지 않습니다. 수치는 저장된 급식 영양 리포트의 합계와 평균이며, 잔반 비율을 곱해 실제 섭취 영양소로 환산하지 않습니다.</div>`}</section>`;}
function historyRender(reports,wastes,p,errors){const byReport=new Map(reports.map(r=>[r.date,r])),byWaste=new Map(wastes.map(r=>[r.date,r]));return `<section class="nr-section"><h3>날짜별 기록</h3><div class="nr-table-wrap"><table class="nr-table"><thead><tr><th scope="col">날짜</th><th scope="col">열량</th><th scope="col">단백질</th><th scope="col">잔반 면적</th></tr></thead><tbody>${C.dates(p).map(date=>{const r=byReport.get(date),w=byWaste.get(date),n=C.nutrition(r?[r]:[]);return `<tr><th scope="row">${date.slice(5)}</th><td>${errors.nutrition?'조회 실패':n.calories.count?fmt(n.calories.total)+' kcal':'자료 없음'}</td><td>${errors.nutrition?'조회 실패':n.protein.count?fmt(n.protein.total)+' g':'자료 없음'}</td><td>${errors.waste?'조회 실패':w?fmt(w.totalRemainingAreaPercent)+'%':'미측정'}</td></tr>`;}).join('')}</tbody></table></div><p class="nr-sub">날짜를 펼치면 기존 선생님 코멘트와 일별 영양정보를 볼 수 있습니다.</p>${reports.map(r=>`<details class="nr-detail"><summary>${escapeHTML(r.date)} 일별 영양 리포트</summary>${nrRender(r)}</details>`).join('')}</section>`;}
async function readRange(base,p){if(p.mode==='day'){const value=(await get(ref(db,`${base}/${p.start}`))).val();return value?{[p.start]:value}:{};}return (await get(query(ref(db,base),orderByKey(),startAt(p.start),endAt(p.end)))).val()||{};}
async function readNutrition(p){const manual=await readRange(`nutritionReports/students/${uid}`,p);if(p.mode==='day'&&manual[p.start])return C.reports(uid,manual,{},p);const ai=await readRange(`nutritionReports/aiStudents/${uid}`,p);return C.reports(uid,manual,ai,p);}
async function loadStudentReport(){const version=++nrReadVersion;$('nrRefresh').disabled=false;$('nrPreview').replaceChildren();$('userName').textContent='나의 영양리포트';let p;try{p=C.period($('nrMode').value,$('nrDate').value);help(p);}catch(error){$('nrStatus').textContent=error.message;return;}if(!C.keyOK(uid)){$('nrStatus').textContent='학생 전용 링크가 필요합니다. 전달받은 리포트 링크로 접속해 주세요.';return;}$('nrStatus').textContent=labels[p.mode]+' 리포트를 불러오는 중입니다…';$('nrRefresh').disabled=true;
try{const [nr,wr]=await Promise.allSettled([readNutrition(p),readRange(`students/${uid}/wasteReports`,p).then(days=>C.waste(uid,days,p))]);if(version!==nrReadVersion)return;const reports=nr.status==='fulfilled'?nr.value:[],wastes=wr.status==='fulfilled'?wr.value:[],errors={nutrition:nr.status==='rejected'?'영양 리포트를 불러오지 못했습니다. 연결 상태와 Firebase 읽기 권한을 확인한 뒤 다시 불러와 주세요.':'',waste:wr.status==='rejected'?'잔반 기록을 불러오지 못했습니다. 연결 상태와 Firebase 읽기 권한을 확인한 뒤 다시 불러와 주세요.':''};const name=reports.find(r=>typeof r.studentName==='string'&&r.studentName)?.studentName||wastes.find(r=>typeof r.studentName==='string'&&r.studentName)?.studentName;$('userName').textContent=name?name+' 학생의 '+labels[p.mode]+' 영양리포트':'나의 '+labels[p.mode]+' 영양리포트';$('nrStatus').textContent=errors.nutrition||errors.waste?'일부 정보를 불러오지 못했습니다. 아래 안내를 확인해 주세요.':`${p.start}${p.start===p.end?'':' ~ '+p.end} · 영양 ${reports.length}일 · 잔반 ${wastes.length}일`;
const daily=p.mode==='day'?`<section class="nr-section"><h3>일간 영양 리포트</h3>${errors.nutrition?warning(errors.nutrition):reports.length?nrRender(reports[0]):'<p class="nr-sub">선택한 날짜에 공개된 영양리포트가 없습니다.</p>'}</section>`:periodNutrition(reports,p,errors.nutrition);$('nrPreview').innerHTML=daily+wasteRender(wastes,p,errors.waste)+(p.mode==='day'?'':historyRender(reports,wastes,p,errors));
const next=new URLSearchParams(location.search);next.set('date',$('nrDate').value);next.set('period',p.mode);try{history.replaceState(null,'',location.pathname+'?'+next.toString()+location.hash);}catch{}
}catch(error){if(version===nrReadVersion)$('nrStatus').textContent='리포트 표시 중 문제가 발생했습니다. 다시 불러와 주세요.';}finally{if(version===nrReadVersion)$('nrRefresh').disabled=false;}}
