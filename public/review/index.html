<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우리학교 급식 리뷰</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

/* =====================================================
   기존 스마트 급식 시스템 CSS
===================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #FF6B35;
  --primary-light: #fff0e8;
  --secondary: #F7C59F;
  --accent: #1A1A2E;
  --bg: #FFF8F3;
  --card: #FFFFFF;
  --muted: #8B7355;
  --success: #4CAF50;
  --danger: #E53935;
}

html,
body {
  min-height: 100%;
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--accent);
}

body {
  overflow-x: hidden;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  background: var(--accent);
  color: white;
  padding: 18px 24px 15px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 24px rgba(26,26,46,0.35);
}

.header-logo {
  font-size: 28px;
  line-height: 1;
}

.header-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.header-sub {
  font-size: 11px;
  opacity: 0.45;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* USER BAR */

.user-bar {
  background: var(--accent);
  padding: 0 24px 16px;
  color: white;
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 38px;
  height: 38px;
  background: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.user-name {
  font-size: 14px;
  font-weight: 600;
}

.user-sub {
  font-size: 12px;
  opacity: 0.5;
  margin-top: 2px;
}

/* CONTENT */

.content {
  padding: 20px 16px 40px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* CARD */

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.04);
}

.card.center {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}

/* ANIMATION */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-up {
  animation: fadeUp 0.38s ease forwards;
}

/* BUTTON */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  outline: none;
  letter-spacing: -0.2px;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
}

.btn-primary:hover {
  background: #e85a26;
  transform: translateY(-1px);
}

.btn-primary:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: #f0ebe5;
  color: var(--accent);
}

.btn-danger {
  background: #ffeaea;
  color: var(--danger);
}

.btn-full {
  width: 100%;
  margin-top: 8px;
}

/* =====================================================
   GEMINI OCR
===================================================== */

.ocr-video-wrap {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--accent);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
}

.ocr-video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
}

.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary);
  opacity: 0.9;
  animation: scanDown 2s ease-in-out infinite;
}

@keyframes scanDown {
  0% {
    top: 0;
  }

  50% {
    top: calc(100% - 3px);
  }

  100% {
    top: 0;
  }
}

.scan-corners {
  position: absolute;
  inset: 12px;
  pointer-events: none;
}

.sc {
  position: absolute;
  width: 22px;
  height: 22px;
  border-color: var(--primary);
  border-style: solid;
  opacity: 0.9;
}

.sc-tl {
  top: 0;
  left: 0;
  border-width: 2px 0 0 2px;
  border-radius: 4px 0 0 0;
}

.sc-tr {
  top: 0;
  right: 0;
  border-width: 2px 2px 0 0;
  border-radius: 0 4px 0 0;
}

.sc-bl {
  bottom: 0;
  left: 0;
  border-width: 0 0 2px 2px;
  border-radius: 0 0 0 4px;
}

.sc-br {
  bottom: 0;
  right: 0;
  border-width: 0 2px 2px 0;
  border-radius: 0 0 4px 0;
}

.ocr-status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(26,26,46,0.84);
  backdrop-filter: blur(6px);
  border-radius: 100px;
  padding: 9px 18px;
  color: white;
  font-size: 13px;
  font-weight: 600;
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}

.ocr-status-bar.hidden {
  opacity: 0;
}

.ocr-spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2.5px solid rgba(255,255,255,0.25);
  border-top-color: var(--primary);
  animation: ocrSpin .75s linear infinite;
}

@keyframes ocrSpin {
  to {
    transform: rotate(360deg);
  }
}

.ocr-result-box {
  width: 100%;
  background: var(--primary-light);
  border: 2px solid var(--secondary);
  border-radius: 14px;
  padding: 14px 18px;
  display: none;
  margin-bottom: 14px;
}

.ocr-result-box.visible {
  display: block;
}

.ocr-result-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.ocr-result-name {
  font-size: 24px;
  font-weight: 900;
  color: var(--accent);
}

.firebase-status {
  width: 100%;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  display: none;
  margin-bottom: 14px;
}

.firebase-status.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #e8f0fe;
  color: #1a73e8;
}

.firebase-status.found {
  display: block;
  background: #e8f5e9;
  color: #2e7d32;
  border: 1.5px solid #a5d6a7;
}

.firebase-status.not-found {
  display: block;
  background: #fff3e0;
  color: #e65100;
  border: 1.5px solid #ffcc80;
}

.firebase-status.error {
  display: block;
  background: #ffeaea;
  color: var(--danger);
  border: 1.5px solid #ffcdd2;
}

.fb-spinner {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(26,115,232,.25);
  border-top-color: #1a73e8;
  animation: ocrSpin .75s linear infinite;
}

@keyframes shutterFlash {
  0% {
    opacity: 1;
  }

  15% {
    opacity: .05;
  }

  100% {
    opacity: 1;
  }
}

.shutter-flash {
  animation: shutterFlash .3s ease;
}

.btn-capture {
  width: 100%;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 13px 20px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,107,53,.35);
  transition: all .2s;
  margin-bottom: 10px;
}

.btn-capture:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.manual-input-wrap {
  width: 100%;
  background: #f5f0eb;
  border-radius: 14px;
  padding: 16px;
  margin-top: 8px;
  display: none;
}

.manual-input-wrap.visible {
  display: block;
}

.manual-input-wrap label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}

.manual-input-wrap input {
  width: 100%;
  border: 2px solid #e8e0d8;
  border-radius: 10px;
  padding: 10px 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  outline: none;
  background: white;
}

.manual-input-wrap input:focus {
  border-color: var(--primary);
}

/* =====================================================
   REVIEW APP
===================================================== */

.hidden {
  display: none !important;
}

.user-review-box {
  background: white;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 16px rgba(0,0,0,.06);
}

.user-review-name {
  font-size: 19px;
  font-weight: 900;
}

.user-review-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* TODAY MENU */

.today-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.today-date {
  font-size: 13px;
  color: #8d95a3;
}

.today-title {
  font-size: 23px;
  font-weight: 800;
  margin-top: 5px;
}

.today-emoji {
  font-size: 40px;
}

.menu-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.menu-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 15px;
  background: #f7f8fa;
}

.menu-icon {
  font-size: 27px;
}

.menu-category {
  font-size: 12px;
  color: #9299a6;
}

.menu-name {
  font-size: 16px;
  font-weight: 700;
  margin-top: 3px;
}

/* RATING */

.rating-wrap {
  text-align: center;
  padding: 10px 0 25px;
}

.rating-label {
  font-weight: 700;
  margin-bottom: 12px;
}

.stars {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.star {
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 40px;
  color: #dfe3e8;
  transition: .15s;
}

.star.active {
  color: #ffc107;
}

.rating-number {
  margin-top: 8px;
  color: #8d95a3;
}

/* SCORE */

.score-section {
  margin-bottom: 25px;
}

.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.score-name {
  font-weight: 700;
}

.score-buttons {
  display: flex;
  gap: 5px;
}

.score-btn {
  width: 34px;
  height: 34px;
  border: 1px solid #e0e4ea;
  background: white;
  border-radius: 9px;
  cursor: pointer;
}

.score-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* CHOICE */

.input-label {
  display: block;
  font-weight: 700;
  margin-bottom: 12px;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 9px;
}

.choice {
  padding: 13px;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
  font-size: 14px;
  background: white;
}

.choice.active {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 700;
}

/* TEXT */

.review-input,
.recommend-input {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  border: 1px solid #e1e5ec;
  border-radius: 13px;
  padding: 14px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.review-input:focus,
.recommend-input:focus {
  border-color: var(--primary);
}

.review-visibility {
  display: flex;
  gap: 10px;
  margin: 14px 0 18px;
}

.review-visibility label {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px;
  border: 2px solid #e8e0d8;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-weight: 700;
}

/* RECOMMEND */

.recommend-card {
  background: linear-gradient(
    135deg,
    #fff3ea,
    #ffffff
  );
}

.recommend-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 1px;
}

.recommend-title {
  font-size: 23px;
  font-weight: 800;
  margin-top: 6px;
}

.recommend-desc {
  margin-top: 8px;
  color: #8a929f;
  font-size: 13px;
  line-height: 1.6;
}

.recommend-input-wrap {
  margin-top: 20px;
}

.recommend-input {
  min-height: 60px;
}

.recommend-result {
  margin-top: 15px;
}

.recommend-item {
  padding: 14px;
  background: white;
  border-radius: 13px;
  margin-bottom: 8px;
  font-weight: 700;
}

/* POPULAR */

.popular-list,
.review-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.popular-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #f7f8fa;
  border-radius: 13px;
}

.popular-name {
  font-weight: 700;
}

.popular-rating {
  color: #ffb300;
  font-weight: 800;
}

/* REVIEW */

.review-item {
  padding: 15px;
  border-radius: 13px;
  background: #f7f8fa;
}

.review-top {
  display: flex;
  justify-content: space-between;
}

.review-student {
  font-weight: 700;
}

.review-stars {
  color: #ffc107;
}

.review-comment {
  margin-top: 8px;
  color: #636b78;
  font-size: 14px;
}

.loading {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 20px;
}

.loading-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b9c0ca;
  animation: loading 1s infinite alternate;
}

.loading-dot:nth-child(2) {
  animation-delay: .2s;
}

.loading-dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes loading {
  from {
    opacity: .3;
    transform: translateY(0);
  }

  to {
    opacity: 1;
    transform: translateY(-5px);
  }
}

.empty {
  text-align: center;
  color: #9aa1ad;
  padding: 20px;
  font-size: 13px;
}

.error-message {
  color: var(--danger);
  font-size: 13px;
  margin-top: 10px;
}

/* FOOTER */

.footer {
  text-align: center;
  color: #9aa1ad;
  font-size: 12px;
  margin-top: 10px;
}

/* MOBILE */

@media(max-width:600px) {

  .content {
    padding: 16px 12px 40px;
  }

  .card {
    padding: 20px;
  }

  .score-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .choice-grid {
    grid-template-columns: 1fr;
  }

}

</style>
<script src="../student-card-core.js?v=1"></script><style>#ocrCard [hidden]{display:none!important}</style></head>

<body>

<div id="app">

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <div class="header">

    <div class="header-logo">
      🍱
    </div>

    <div>

      <div class="header-title">
        우리학교 급식
      </div>

      <div class="header-sub">
        Smart Cafeteria Review
      </div>

    </div>

  </div>


  <!-- ===================================================
       USER BAR
  ==================================================== -->

  <div
    class="user-bar"
    id="userBar"
  >

    <div class="user-avatar">
      👤
    </div>

    <div>

      <div
        class="user-name"
        id="barName"
      >
        사용자 인식 중
      </div>

      <div
        class="user-sub"
        id="barSub"
      >
        얼굴을 비추면 자동으로 로그인합니다
      </div>

    </div>

  </div>


  <!-- ===================================================
       CONTENT
  ==================================================== -->

  <div class="content">


    <!-- =================================================
         FACE LOGIN
    ================================================== -->

    <section
      class="card center fade-up"
      id="ocrCard"
    >

      <div class="card-title">
        🙂 얼굴 인식 로그인
      </div>


      <div
        class="ocr-video-wrap"
        id="ocrVideoWrap"
      >

        <video
          id="videoRecog"
          autoplay
          muted
          playsinline
        ></video>


        <div class="scan-line"></div>


        <div class="scan-corners">

          <div class="sc sc-tl"></div>
          <div class="sc sc-tr"></div>
          <div class="sc sc-bl"></div>
          <div class="sc sc-br"></div>

        </div>


        <div
          class="ocr-status-bar hidden"
          id="ocrStatusBar"
        >

          <div
            class="ocr-spinner"
            id="ocrSpinner"
          ></div>

          <span id="ocrStatusText">
            인식 중...
          </span>

        </div>

      </div>


      <!-- OCR RESULT -->

      <div
        class="ocr-result-box"
        id="ocrResultBox"
      >

        <div class="ocr-result-label">
          📝 식별 결과
        </div>

        <div
          class="ocr-result-name"
          id="ocrResultName"
        >
          —
        </div>

      </div>


      <!-- FIREBASE RESULT -->

      <div
        class="firebase-status"
        id="firebaseStatus"
      ></div>


      <!-- CAPTURE -->

      <button
        class="btn-capture"
        id="btnCapture"
      >
        🙂 지금 다시 확인
      </button>


      <button class="btn-capture" id="btnStudentCardMode">학생증 인식</button>
      <button class="btn-capture" id="btnStudentCardCapture" hidden>학생증 촬영</button>
      <button class="btn-capture" id="btnReviewFaceMode" hidden>얼굴 자동 인식으로 돌아가기</button>

      <!-- MANUAL -->

      <div
        class="manual-input-wrap"
        id="manualInputWrap"
      >

        <label>
          이름 직접 입력
        </label>

        <input
          type="text"
          id="manualNameInput"
          placeholder="홍길동"
          maxlength="10"
        >

        <button
          class="btn btn-primary btn-full"
          id="manualSearchButton"
        >
          🔍 학생 조회
        </button>

      </div>


      <canvas
        id="ocrCanvas"
        style="display:none"
      ></canvas>

    </section>


    <!-- =================================================
         REVIEW APP
    ================================================== -->

    <main
      id="reviewApp"
      class="hidden"
    >


      <!-- USER -->

      <section class="user-review-box">

        <div>

          <div
            class="user-review-name"
            id="userName"
          >
            학생
          </div>

          <div
            class="user-review-sub"
            id="userInfo"
          ></div>

        </div>

        <button
          class="btn btn-secondary"
          id="logoutButton"
        >
          로그아웃
        </button>

      </section>


      <!-- =================================================
           TODAY MENU
      ================================================== -->

      <section class="card fade-up">

        <div class="today-head">

          <div>

            <div
              class="today-date"
              id="todayDate"
            ></div>

            <div class="today-title">
              오늘의 급식
            </div>

          </div>

          <div class="today-emoji">
            🍱
          </div>

        </div>


        <div
          class="menu-list"
          id="todayMenuList"
        >

          <div class="loading">

            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>

          </div>

        </div>

      </section>


      <!-- =================================================
           REVIEW
      ================================================== -->

  );

    setFirebaseStatus("error", "얼굴 인식 모델을 불러오지 못했습니다.");

  }

}



let reviewRecognitionMode = "face", reviewCardBusy = false;
let reviewFaceTimer = null, reviewFaceGeneration = 0, reviewFaceBusy = false;
function canReviewFace() {
  return !currentStudent && !$("ocrCard").classList.contains("hidden") && !document.hidden;
}
function stopReviewAutoFace() {
  reviewFaceGeneration++;
  clearTimeout(reviewFaceTimer);
  reviewFaceTimer = null;
}
function startReviewAutoFace() {
  clearTimeout(reviewFaceTimer);
  const generation = reviewFaceGeneration;
  const scan = async () => {
    if (generation !== reviewFaceGeneration || !canReviewFace() || reviewRecognitionMode !== "face") return;
    if (faceModelsReady && recogStream && $("videoRecog").videoWidth && !reviewFaceBusy) await captureFaceLogin(true);
    if (generation === reviewFaceGeneration && canReviewFace()) reviewFaceTimer = setTimeout(scan, 450);
  };
  reviewFaceTimer = setTimeout(scan, 0);
}
window.addEventListener("pagehide", stopRecogCamera);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopRecogCamera();
  else if (canReviewFace()) initRecognition();
});

async function captureFaceLogin(automatic = false) {
  automatic = automatic === true;
  if (reviewFaceBusy || !canReviewFace()) return;
  if (!recogStream) { await initRecognition(); return; }
  const generation = reviewFaceGeneration;
  const current = () => generation === reviewFaceGeneration && canReviewFace() && reviewRecognitionMode === "face";
  reviewFaceBusy = true;

  const video = $("videoRecog");
  const button = $("btnCapture");

  button.disabled = true;
  button.textContent = "얼굴 식별 중...";
  setOcrStatus("loading", "등록된 학생 얼굴과 비교하고 있습니다...");

  try {

    if (!faceModelsReady) {
      await loadFaceModels();
    }

    if (!current()) return;
    if (!video.videoWidth) {
      throw new Error("카메라 준비를 기다려주세요.");
    }

    const detections =
      await faceapi
        .detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptors();

    if (!current()) return;
    if (automatic && detections.length !== 1) {
      setOcrStatus("loading", detections.length ? "한 사람만 카메라에 나오게 해주세요." : "얼굴을 비추면 자동으로 로그인합니다.");
      return;
    }
    if (detections.length === 0) {
      throw new Error("얼굴을 찾지 못했습니다. 정면을 바라봐주세요.");
    }

    if (detections.length > 1) {
      throw new Error("한 사람만 카메라에 나오게 해주세요.");
    }

    const snapshot = await get(ref(db, "students"));
    if (!current()) return;
    let best = null;

    if (snapshot.exists()) {

      Object.entries(snapshot.val()).forEach(([uid, student]) => {

        const saved = student?.faceDescriptor;

        if (!Array.isArray(saved) || saved.length !== 128 || !saved.every(v => Number.isFinite(Number(v)))) {
          return;
        }

        const distance = faceapi.euclideanDistance(
          detections[0].descriptor,
          new Float32Array(saved.map(Number))
        );

        if (Number.isFinite(distance) && (!best || distance < best.distance)) {

          best = {
            distance,
            uid,
            name: student.name || student["이름"] || "이름 없음",
            grade: Number(student.grade ?? student["학년"]),
            classNum: Number(
              student.class ??
              student.classNum ??
              student.classNo ??
              student["반"]
            ),
            number: Number(student.number ?? student["번호"])
          };

        }

      });

    }

    if (!best || best.distance > FACE_MATCH_THRESHOLD) {
      throw new Error("등록된 학생 얼굴과 일치하지 않습니다.");
    }

    currentStudent = best;
    try { sessionStorage.setItem("reviewStudent", JSON.stringify(best)); } catch {}
    $("ocrResultName").textContent = best.name;
    $("ocrResultBox").classList.add("visible");
    setOcrStatus("hidden");
    setFirebaseStatus(
      "found",
      `✅ ${best.grade || ""}학년 ${best.classNum || ""}반 ${best.number || ""}번 · ${best.name}`
    );
    updateUserBar(best);
    stopRecogCamera();
    const acceptedGeneration = reviewFaceGeneration;
    setTimeout(() => { if (acceptedGeneration === reviewFaceGeneration && currentStudent?.uid === best.uid) showReviewApp(); }, 500);

  } catch (error) {

    if (!current()) return;
    if (!automatic) console.error("얼굴 로그인 실패", error);
    $("manualInputWrap").classList.add("visible");
    setOcrStatus("hidden");
    setFirebaseStatus("error", error.message || "얼굴 식별에 실패했습니다.");
    button.disabled = false;
    button.textContent = "🙂 다시 얼굴 인식";
    button.onclick = captureFaceLogin;

  } finally {
    reviewFaceBusy = false;
    button.disabled = false;
    button.textContent = "🙂 지금 다시 확인";
  }

}


/* =====================================================
   CAMERA
===================================================== */

async function initRecognition() {
  if (!canReviewFace()) return;
  stopRecogCamera();
  const generation = reviewFaceGeneration;
  const video = $("videoRecog");
  let stream = null;
  try {
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
    } catch (error) {
      if (generation !== reviewFaceGeneration || !canReviewFace()) return;
      stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
    }
    if (generation !== reviewFaceGeneration || !canReviewFace()) {
      stream.getTracks().forEach(track => track.stop()); return;
    }
    recogStream = stream;
    video.srcObject = stream;
    await video.play();
    if (generation !== reviewFaceGeneration || !canReviewFace()) return;
    syncReviewCardButtons();
    setOcrStatus("loading", reviewRecognitionMode === "card" ? "학생증을 비추고 학생증 촬영 버튼을 누르세요." : "얼굴을 비추면 자동으로 로그인합니다.");
    if (reviewRecognitionMode === "face") startReviewAutoFace();
  } catch (error) {
    if (generation !== reviewFaceGeneration) return;
    stopRecogCamera();
    setOcrStatus("hidden");
    $("manualInputWrap").classList.add("visible");
    setFirebaseStatus("error", "카메라 권한을 허용한 뒤 지금 다시 확인을 눌러 주세요. 이름 입력도 사용할 수 있습니다.");
  }
}

function stopRecogCamera() {

  stopReviewAutoFace();
  $("videoRecog").srcObject = null;

  if (!recogStream) {
    return;
  }


  recogStream
    .getTracks()
    .forEach(track => {

      track.stop();

    });


  recogStream =
    null;

}


/* =====================================================
   OCR STATUS
===================================================== */

function setOcrStatus(
  state,
  text
) {

  const bar =
    $("ocrStatusBar");

  const spinner =
    $("ocrSpinner");

  const statusText =
    $("ocrStatusText");


  if (state === "hidden") {

    bar.classList.add(
      "hidden"
    );

    return;

  }


  bar.classList.remove(
    "hidden"
  );


  statusText.textContent =
    text || "";


  spinner.style.display =
    state === "loading"
      ? "block"
      : "none";

}


/* =====================================================
   FIREBASE STATUS
===================================================== */

function setFirebaseStatus(
  state,
  text
) {

  const el =
    $("firebaseStatus");


  el.className =
    "firebase-status";
  el.style.display = "";


  if (state === "hidden") {

    el.style.display =
      "none";

    return;

  }


  if (state === "loading") {

    el.classList.add(
      "loading"
    );

    el.innerHTML =
      `<div class="fb-spinner"></div>${escapeHTML(text)}`;

    return;

  }


  el.classList.add(
    state
  );

  el.textContent =
    text;

}

async function captureAndOCR() {
  if (reviewCardBusy || !canReviewFace() || reviewRecognitionMode !== "card") return;
  const generation = reviewFaceGeneration;
  const current = () => generation === reviewFaceGeneration && canReviewFace() && reviewRecognitionMode === "card";
  const button = $("btnStudentCardCapture");
  reviewCardBusy = true; button.disabled = true;
  setOcrStatus("loading", "Gemini로 학생증 정보를 읽고 있습니다...");
  try {
    const identity = await StudentCardCore.read($("videoRecog"), {current, getEndpoint: async () => {
      if (!GEMINI_API_KEY) await initGeminiKey();
      return GEMINI_API_KEY ? GEMINI_ENDPOINT : "";
    }});
    if (!current()) return;
    const snapshot = await get(ref(db, "students"));
    if (!current()) return;
    const student = StudentCardCore.choose(snapshot.val(), identity);
    currentStudent = student;
    try { sessionStorage.setItem("reviewStudent", JSON.stringify(student)); } catch {}
    $("ocrResultName").textContent = student.name; $("ocrResultBox").classList.add("visible");
    setOcrStatus("hidden");
    setFirebaseStatus("found", student.name + " 학생 확인 완료");
    updateUserBar(student);
    stopRecogCamera();
    const accepted = reviewFaceGeneration;
    setTimeout(() => { if (accepted === reviewFaceGeneration && currentStudent?.uid === student.uid) showReviewApp(); }, 500);
  } catch (error) {
    if (current()) { setOcrStatus("hidden"); setFirebaseStatus("error", error.message || "학생증 인식에 실패했습니다."); $("manualInputWrap").classList.add("visible"); }
  } finally {
    reviewCardBusy = false; button.disabled = false;
  }
}

/* =====================================================
   STUDENT LOOKUP
===================================================== */

async function lookupStudentByName(
  name
) {

  const snapshot =
    await get(
      ref(
        db,
        "students"
      )
    );


  if (!snapshot.exists()) {

    return null;

  }


  const students =
    snapshot.val();


  let found =
    null;


  Object.entries(
    students
  ).some(
    ([uid, student]) => {

      if (
        student &&
        String(
          student.name || ""
        ).trim() === name.trim()
      ) {

        found = {

          uid,

          name:
            student.name ||
            name,

          grade:
            student.grade ??
            student["학년"] ??
            null,

          classNum:
            student.class ??
            student["반"] ??
            null,

          number:
            student.number ??
            student["번호"] ??
            null

        };


        return true;

      }


      return false;

    }
  );


  return found;

}

   NAME FOUND
===================================================== */

async function handleNameFound(
  recognizedName
) {

  $("ocrResultName")
    .textContent =
    recognizedName;


  $("ocrResultBox")
    .classList
    .add("visible");


  setFirebaseStatus(
    "loading",
    `"${recognizedName}" 학생 정보 조회 중...`
  );


  const button =
    $("btnCapture");


  button.disabled =
    true;


  button.textContent =
    "⏳ Firebase 조회 중...";


  try {

    const student =
      await lookupStudentByName(
        recognizedName
      );


    if (!student) {

      setFirebaseStatus(
        "not-found",
        `⚠️ "${recognizedName}" 학생을 DB에서 찾을 수 없어요.`
      );


      button.textContent =
        "📷 다시 찍기";


      button.disabled =
        false;


      button.onclick = openReviewCardMode;


      $("manualInputWrap")
        .classList
        .add("visible");


      $("manualNameInput")
        .value =
        recognizedName;


      return;

    }


    currentStudent =
      student;


    sessionStorage.setItem(
      "reviewStudent",
      JSON.stringify(
        student
      )
    );


    setFirebaseStatus(
      "found",
      `✅ ${student.grade || ""}학년 ${student.classNum || ""}반 ${student.number || ""}번 · ${student.name}`
    );


    updateUserBar(
      student
    );


    stopRecogCamera();

/* =====================================================
   MENU
===================================================== */

function getMenuName(
  value,
  key
) {

  if (
    typeof value === "string"
  ) {

    return value;

  }


  if (
    value &&
    typeof value === "object"
  ) {

    return (

      value.name ||
      value.menu ||
      value.title ||
      key

    );

  }


  return key;

}


async function loadMenus() {
  const list = document.getElementById("todayMenuList");
  const choiceGrid = document.getElementById("choiceGrid");

  try {
    const snapshot = await get(ref(db, "menu"));

    if (!snapshot.exists()) {
      list.innerHTML = "<p>등록된 급식 메뉴가 없습니다.</p>";
      choiceGrid.innerHTML = "";
      return;
    }

    const menu = snapshot.val();

    list.innerHTML = "";
    choiceGrid.innerHTML = "";

    // Firebase의 key
    const categories = ["밥", "국", "김치"];

    // 화면에 표시할 이름
    const displayCategory = {
      "밥": "밥",
      "국": "국",
      "김치": "반찬"
    };

    const emojis = {
      "밥": "🍚",
      "국": "🍲",
      "김치": "🥬"
    };

    categories.forEach(category => {

      // 예:
      // menu["밥"] = "흰밥"
      // menu["국"] = "미역국"
      // menu["김치"] = "배추김치"

      const menuName = menu[category];

      if (!menuName) return;

      // 오늘의 메뉴
      const row = document.createElement("div");
      row.className = "menu-row";

      row.innerHTML = `
        <div class="menu-icon">
          ${emojis[category]}
        </div>

        <div>
          <div class="menu-category">
            ${escapeHTML(displayCategory[category])}
          </div>

          <div class="menu-name">
            ${escapeHTML(menuName)}
          </div>
        </div>
      `;

      list.appendChild(row);


      // 다음에도 먹고 싶은 메뉴
      const choice = document.createElement("div");
      choice.className = "choice";

      choice.innerHTML = `
        <input
          type="checkbox"
          value="${escapeHTML(menuName)}"
        >

        <label>
          ${emojis[category]}
          ${escapeHTML(menuName)}
        </label>
      `;

      choiceGrid.appendChild(choice);
    });

    if (list.children.length === 0) {
      list.innerHTML = "<p>오늘 급식 메뉴가 없습니다.</p>";
    }

    if (choiceGrid.children.length === 0) {
      choiceGrid.innerHTML = "<p>선택할 메뉴가 없습니다.</p>";
    }

  } catch (error) {
    console.error("메뉴 불러오기 오류:", error);

    list.innerHTML = "<p>메뉴를 불러오지 못했습니다.</p>";
    choiceGrid.innerHTML = "";
  }
}

/* =====================================================
   SAVE REVIEW
===================================================== */

$("submitReview")
  .addEventListener(
    "click",
    async () => {

      if (!currentStudent) {

        alert(
          "먼저 학생증을 인식해주세요."
        );

        return;

      }


      if (!currentRating) {

        alert(
          "별점을 선택해주세요."
        );

        return;

      }


      if (
        !scores.taste ||
        !scores.amount ||
        !scores.satisfaction
      ) {

        alert(
          "맛, 양, 만족도를 모두 선택해주세요."
        );

        return;

      }


      const reviewRef =
        push(
          ref(
            db,
            "reviews"
          )
        );


      const visibility =
        document.querySelector(
          'input[name="reviewVisibility"]:checked'
        )?.value || "anonymous";


      const isPublic =
        visibility === "public";


      const reviewData = {

        ...(isPublic
          ? {
              studentId: currentStudent.uid,
              studentName: currentStudent.name
            }
          : {
              studentName: "익명"
            }),

        visibility,

        date:
          todayKey(),

        rating:
          currentRating,

        taste:
          scores.taste,

        amount:
          scores.amount,

        satisfaction:
          scores.satisfaction,

        favoriteMenus:
          selectedMenus,

        comment:
          $("reviewComment")
            .value
            .trim(),

        createdAt:
          Date.now()

      };


      try {

        await set(
          reviewRef,
          reviewData
        );


        /*
          메뉴 선호 데이터
        */

        for (
          const menu of selectedMenus
        ) {

          const safeKey =
            encodeURIComponent(
              menu
            );


          await set(

            ref(
              db,
              `menuPreferences/${safeKey}/${isPublic ? currentStudent.uid : "anonymous-" + reviewRef.key}`
            ),

            {

              ...(isPublic
                ? {
                    studentId: currentStudent.uid,
                    studentName: currentStudent.name
                  }
                : {
                    studentName: "익명"
                  }),

              visibility,

              menu,

              createdAt:
                Date.now()

            }

          );

        }


        alert(
          "⭐ 리뷰가 등록되었습니다!"
        );


        resetReview();


        await Promise.all([

          loadPopularMenus(),

          loadRecentReviews()

        ]);


      } catch (error) {

        console.error(
          error
        );


        alert(
          "리뷰 저장 중 오류가 발생했습니다."
        );

      }

    }
  );


/* =====================================================
   RESET REVIEW
===================================================== */

function resetReview() {

  currentRating =
    0;


  scores = {

    taste: 0,

    amount: 0,

    satisfaction: 0

  };


  selectedMenus =
    [];


  $("stars")
    .querySelectorAll(".star")
    .forEach(
      star => {

        star.classList.remove(
          "active"
        );

      }
    );


  $("ratingText")
    .textContent =
    "별점을 선택해주세요";


  document
    .querySelectorAll(
      ".score-btn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(
      ".choice"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


  $("reviewComment")
    .value =
    "";

  const anonymousOption =
    document.querySelector(
      'input[name="reviewVisibility"][value="anonymous"]'
    );

  if (anonymousOption) {
    anonymousOption.checked = true;
  }

}

async function loadMyRecommendations() {

  const box =
    $("myRecommendations");


  try {

    const snapshot =
      await get(
        ref(
          db,
          "recommendations"
        )
      );


    if (!snapshot.exists()) {

      box.innerHTML =
        `<div class="empty">
          아직 추천한 메뉴가 없습니다.
        </div>`;

      return;

    }


    const list =

      Object
        .values(
          snapshot.val()
        )
        .filter(
          item =>
            item.studentId ===
            currentStudent.uid
        )
        .sort(
          (a,b) =>
            (b.createdAt || 0) -
            (a.createdAt || 0)
        )
        .slice(
          0,
          5
        );


    box.innerHTML =

      list.length

        ? list
            .map(
              item => `

                <div class="recommend-item">
                  🍴 ${escapeHTML(item.menu)}
                </div>

              `
            )
            .join("")

        : `<div class="empty">
             아직 추천한 메뉴가 없습니다.
           </div>`;


  } catch (error) {

    console.error(
      error
    );

    box.innerHTML =
      `<div class="empty">
        추천 메뉴를 불러오지 못했습니다.
      </div>`;

  }

}


/* =====================================================
   POPULAR MENUS
===================================================== */

async function loadPopularMenus() {

  const box =
    $("popularList");


  try {

    const snapshot =
      await get(
        ref(
          db,
          "reviews"
        )
      );


    if (!snapshot.exists()) {

      box.innerHTML =
        `<div class="empty">
          아직 리뷰가 없습니다.
        </div>`;

      return;

    }


    const data =
      {};


    Object
      .values(
        snapshot.val()
      )
      .forEach(
        review => {

          const rating =
            Number(
              review.rating || 0
            );


          (
            review.favoriteMenus ||
            []
          )
            .forEach(
              menu => {

                if (!data[menu]) {

                  data[menu] = {

                    sum: 0,

                    count: 0

                  };

                }


                data[menu].sum +=
                  rating;


                data[menu].count++;

              }
            );

        }
      );


    const popular =

      Object
        .entries(data)
        .map(
          ([name, value]) => ({

            name,

            rating:
              value.sum /
              value.count,

            count:
              value.count

          })
        )
        .sort(
          (a,b) =>
            b.rating - a.rating ||
            b.count - a.count
        )
        .slice(
          0,
          8
        );


    box.innerHTML =

      popular.length

        ? popular
            .map(
              item => `

                <div class="popular-item">

                  <span class="popular-name">
                    🍴 ${escapeHTML(item.name)}
                  </span>

                  <span class="popular-rating">
                    ★ ${item.rating.toFixed(1)}
                    <small>
                      (${item.count})
                    </small>
                  </span>

                </div>

              `
            )
            .join("")

        : `<div class="empty">
             아직 인기 메뉴가 없습니다.
           </div>`;


  } catch (error) {

    console.error(
      error
    );


    box.innerHTML =
      `<div class="empty">
        인기 메뉴를 불러오지 못했습니다.
      </div>`;

  }

}


/* =====================================================
   RECENT REVIEWS
===================================================== */

async function loadRecentReviews() {

  const box =
    $("reviewList");


  try {

    const snapshot =
      await get(
        ref(
          db,
          "reviews"
        )
      );


    if (!snapshot.exists()) {

      box.innerHTML =
        `<div class="empty">
          아직 등록된 리뷰가 없습니다.
        </div>`;

      return;

    }


    const reviews =

      Object
        .values(
          snapshot.val()
        )
        .sort(
          (a,b) =>
            (b.createdAt || 0) -
            (a.createdAt || 0)
        )
        .slice(
          0,
          10
        );


    box.innerHTML =

      reviews
        .map(
          review => {

            const rating =
              Number(
                review.rating || 0
              );


            const stars =
              "★".repeat(
                rating
              ) +
              "☆".repeat(
                5 - rating
              );


            const date =
              review.createdAt

                ? new Date(
                    review.createdAt
                  ).toLocaleDateString(
                    "ko-KR"
                  )

                : "";


            const favorite =
              (
                review.favoriteMenus ||
                []
              )
                .slice(
                  0,
                  4
                )
                .map(
                  escapeHTML
                )
                .join(", ");


            return `

              <div class="review-item">

                <div class="review-top">

                  <span class="review-student">
                    ${escapeHTML(
                      review.visibility === "anonymous"
                        ? "익명"
                        : review.studentName || "학생"
                    )}
                  </span>

                  <span class="review-stars">
                    ${stars}
                  </span>

                </div>


                ${
                  review.comment

                    ? `

                      <div class="review-comment">
                        ${escapeHTML(
                          review.comment
                        )}
                      </div>

                    `

                    : ""
                }


                ${
                  favorite

                    ? `

                      <div
                        style="
                          margin-top:7px;
                          font-size:12px;
                          color:#8d95a3;
                        "
                      >
                        ❤️ ${favorite}
                      </div>

                    `

                    : ""
                }


                <div
                  style="
                    margin-top:7px;
                    font-size:11px;
                    color:#aaa;
                  "
                >
                  ${date}
                </div>

              </div>

            `;

          }
        )
        .join("");


  } catch (error) {

    console.error(
      error
    );


    box.innerHTML =
      `<div class="empty">
        최근 리뷰를 불러오지 못했습니다.
      </div>`;

  }

}
